# Netlify — PWA kuaa Estudante
# `pnpm build` gera o app estático em dist/public (vite) e também dist/index.js
# (servidor Express, que NÃO é publicado: no Netlify quem serve é o CDN estático).

[build]
  command = "pnpm build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  # vite e esbuild estão em devDependencies; pnpm as ignora se NODE_ENV=production.
  NODE_ENV = "development"

# SPA: qualquer rota do app é resolvida pelo index.html (mesma regra de
# client/public/_redirects, replicada aqui para não depender do build).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# service worker e manifest: sem cache, para a versão nova assumir no próximo acesso.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pacote inicial de provas (4,8 MB): valida sempre, para receber conteúdo novo.
[[headers]]
  for = "/initial-student-package.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bundles com hash no nome: podem ficar em cache longo e imutável.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/medals/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
